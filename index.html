<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול הוצאות וסריקת חשבוניות</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Assistant', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12">

  <div class="max-w-xl mx-auto p-4 space-y-6">

    <!-- כותרת והגדרות API -->
    <header class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-lg">
      <div>
        <h1 class="text-xl font-bold text-emerald-400">ניהול הוצאות חכם</h1>
        <p class="text-xs text-slate-400">סריקה וסיווג חשבוניות ב-AI</p>
      </div>
      <button onclick="toggleSettings()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition">
        ⚙️ מפתח API
      </button>
    </header>

    <!-- פאנל הגדרת מפתח -->
    <div id="settingsPanel" class="hidden bg-slate-900 p-4 rounded-2xl border border-amber-500/30 space-y-2">
      <label class="block text-xs text-slate-300">Gemini API Key:</label>
      <div class="flex gap-2">
        <input type="password" id="apiKeyInput" placeholder="הכנס את המפתח כאן..." class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
        <button onclick="saveApiKey()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg text-sm font-semibold transition">שמור</button>
      </div>
      <p class="text-[11px] text-slate-400">המפתח נשמר בדפדפן בלבד (LocalStorage).</p>
    </div>

    <!-- כרטיס סיכום מהיר -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
        <span class="text-xs text-slate-400">סה״כ הוצאות שמורות</span>
        <div id="totalExpenses" class="text-2xl font-bold text-emerald-400 mt-1">₪0.00</div>
      </div>
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
        <span class="text-xs text-slate-400">מספר חשבוניות</span>
        <div id="totalReceiptsCount" class="text-2xl font-bold text-cyan-400 mt-1">0</div>
      </div>
    </div>

    <!-- אזור סריקה / צילום חשבונית -->
    <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-4">
      <h2 class="font-semibold text-sm text-slate-200 flex items-center gap-2">
        <span>📸</span> סריקת חשבונית חדשה
      </h2>

      <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-700 hover:border-emerald-500/60 rounded-xl p-6 cursor-pointer bg-slate-950/40 hover:bg-slate-950 transition group">
        <svg class="w-8 h-8 text-slate-400 group-hover:text-emerald-400 transition mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
        <span class="text-xs font-semibold text-slate-300">לחץ לצילום או בחירת קובץ חשבונית</span>
        <span class="text-[10px] text-slate-500 mt-1">תומך ב-JPG, PNG, HEIC</span>
        <input type="file" id="receiptInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event)">
      </label>

      <!-- מצב טעינה -->
      <div id="loadingIndicator" class="hidden text-center py-4 space-y-2">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-emerald-500"></div>
        <p class="text-xs text-slate-300">ה-AI מנתח את החשבונית ומסווג פריטים...</p>
      </div>

      <!-- תוצאת הניתוח -->
      <div id="receiptResult" class="hidden space-y-3 pt-2">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <h3 class="font-bold text-sm text-emerald-400" id="resStoreName">-</h3>
          <span class="text-xs text-slate-400" id="resDate">-</span>
        </div>

        <div id="itemsContainer" class="space-y-2 max-h-56 overflow-y-auto pr-1"></div>

        <div class="flex justify-between items-center pt-2 font-bold text-sm">
          <span>סה״כ חשבונית:</span>
          <span id="resTotalAmount" class="text-emerald-400 text-lg">₪0.00</span>
        </div>

        <button onclick="saveCurrentReceipt()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl transition text-sm shadow-md">
          שמור הוצאה במסד הנתונים
        </button>
      </div>
    </div>

    <!-- גרף התפלגות קטגוריות -->
    <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-3">
      <h2 class="font-semibold text-sm text-slate-200">התפלגות הוצאות לפי קטגוריה</h2>
      <div class="w-full max-w-[260px] mx-auto">
        <canvas id="categoryChart"></canvas>
      </div>
    </div>

    <!-- היסטוריית חשבוניות אחרונות -->
    <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="font-semibold text-sm text-slate-200">היסטוריית חשבוניות</h2>
        <button onclick="clearAllData()" class="text-[11px] text-red-400 hover:underline">מחק הכל</button>
      </div>
      <div id="historyList" class="space-y-2">
        <p class="text-xs text-slate-500 text-center py-4">אין חשבוניות שמורות עדיין.</p>
      </div>
    </div>

  </div>

  <script>
    let currentReceiptData = null;
    let chartInstance = null;

    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
      renderHistoryAndStats();
    };

    function toggleSettings() {
      const panel = document.getElementById('settingsPanel');
      panel.classList.toggle('hidden');
    }

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if (!key) return alert('נא להזין מפתח תקין');
      localStorage.setItem('gemini_api_key', key);
      alert('המפתח נשמר בהצלחה!');
      toggleSettings();
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        alert('יש להגדיר קודם מפתח Gemini API בכפתור ההגדרות למעלה');
        toggleSettings();
        return;
      }

      document.getElementById('loadingIndicator').classList.remove('hidden');
      document.getElementById('receiptResult').classList.add('hidden');

      try {
        const base64Image = await fileToBase64(file);

        const prompt = `אתה מנתח חשבוניות מקצועי. חלץ מהתמונה את הנתונים והחזר JSON בלבד במבנה הבא:
{
  "store_name": "שם בית העסק",
  "date": "YYYY-MM-DD",
  "total_amount": 0.00,
  "items": [
    {
      "name": "שם המוצר",
      "price": 0.00,
      "category": "קטגוריה (מזון וסופר / פארם והיגיינה / ביגוד / תחזוקת בית / פנאי / שונות)"
    }
  ]
}`;

        // תמיכה ב-gemini-2.5-flash עם fallback ל-gemini-1.5-flash-latest
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                {
                  inline_data: {
                    mime_type: file.type || "image/jpeg",
                    data: base64Image
                  }
                }
              ]
            }],
            generationConfig: {
              response_mime_type: "application/json"
            }
          })
        });

        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error.message || 'שגיאה בניתוח החשבונית');
        }

        const rawText = data.candidates[0].content.parts[0].text;
        currentReceiptData = JSON.parse(rawText);

        displayParsedReceipt(currentReceiptData);
      } catch (err) {
        console.error(err);
        alert('שגיאה בעיבוד החשבונית: ' + err.message);
      } finally {
        document.getElementById('loadingIndicator').classList.add('hidden');
      }
    }

    function displayParsedReceipt(data) {
      document.getElementById('resStoreName').innerText = data.store_name || 'בית עסק';
      document.getElementById('resDate').innerText = data.date || new Date().toISOString().split('T')[0];
      document.getElementById('resTotalAmount').innerText = `₪${parseFloat(data.total_amount || 0).toFixed(2)}`;

      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';

      (data.items || []).forEach((item) => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between bg-slate-950/60 p-2 rounded-lg text-xs border border-slate-800 gap-2';
        row.innerHTML = `
          <input type="text" value="${item.name}" class="bg-transparent border-b border-transparent focus:border-emerald-500 focus:outline-none flex-1 text-slate-200">
          <input type="text" value="${item.category}" class="bg-slate-800 text-[10px] px-2 py-0.5 rounded text-emerald-400 border border-slate-700 w-24 text-center">
          <span class="font-semibold text-slate-100">₪${parseFloat(item.price || 0).toFixed(2)}</span>
        `;
        container.appendChild(row);
      });

      document.getElementById('receiptResult').classList.remove('hidden');
    }

    function saveCurrentReceipt() {
      if (!currentReceiptData) return;

      const receipts = JSON.parse(localStorage.getItem('receipts_data') || '[]');
      currentReceiptData.id = Date.now();
      receipts.unshift(currentReceiptData);
      localStorage.setItem('receipts_data', JSON.stringify(receipts));

      document.getElementById('receiptResult').classList.add('hidden');
      document.getElementById('receiptInput').value = '';
      currentReceiptData = null;

      renderHistoryAndStats();
      alert('החשבונית נשמרה בהצלחה!');
    }

    function renderHistoryAndStats() {
      const receipts = JSON.parse(localStorage.getItem('receipts_data') || '[]');
      
      let grandTotal = 0;
      const categoryTotals = {};

      const historyContainer = document.getElementById('historyList');
      historyContainer.innerHTML = '';

      if (receipts.length === 0) {
        historyContainer.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">אין חשבוניות שמורות עדיין.</p>';
      }

      receipts.forEach(r => {
        grandTotal += parseFloat(r.total_amount || 0);

        (r.items || []).forEach(item => {
          const cat = item.category || 'שונות';
          categoryTotals[cat] = (categoryTotals[cat] || 0) + parseFloat(item.price || 0);
        });

        const el = document.createElement('div');
        el.className = 'flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs';
        el.innerHTML = `
          <div>
            <div class="font-bold text-slate-200">${r.store_name}</div>
            <div class="text-[10px] text-slate-400">${r.date} • ${r.items ? r.items.length : 0} פריטים</div>
          </div>
          <div class="font-bold text-emerald-400">₪${parseFloat(r.total_amount || 0).toFixed(2)}</div>
        `;
        historyContainer.appendChild(el);
      });

      document.getElementById('totalExpenses').innerText = `₪${grandTotal.toFixed(2)}`;
      document.getElementById('totalReceiptsCount').innerText = receipts.length;

      updateChart(categoryTotals);
    }

    function updateChart(categoryData) {
      const ctx = document.getElementById('categoryChart').getContext('2d');
      const labels = Object.keys(categoryData);
      const data = Object.values(categoryData);

      if (chartInstance) chartInstance.destroy();

      if (labels.length === 0) {
        labels.push('אין נתונים');
        data.push(1);
      }

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: [
              '#10b981', '#06b6d4', '#3b82f6', '#8b5cf6', 
              '#ec4899', '#f59e0b', '#64748b'
            ],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#94a3b8', font: { size: 10, family: 'Assistant' } }
            }
          }
        }
      });
    }

    function clearAllData() {
      if (confirm('האם למחוק את כל נתוני ההוצאות?')) {
        localStorage.removeItem('receipts_data');
        renderHistoryAndStats();
      }
    }
  </script>
</body>
</html>
